name: Publish RC1 static Android demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-demo.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: android-demo-rc1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Jilinkin/anjun-harbor/actions/runs/45579229576 --jq 'select(.conclusion == "success" and .head_sha == "4878a659264c1ecb10e81f0d9213231838a1f01a") | .id' | grep -x 45579229576
      - uses: actions/download-artifact@v4
        with:
          name: harbor-android-prototype
          run-id: 45579229576
          github-token: ${{ github.token }}
          path: engine/android/build
      - name: Verify and prepare static files
        run: |
          cd engine/android/build
          sha256sum -c sha256.txt
          cd ..
          python3 verify.py
          cd ../..
          python3 engine/android/publish_static_demo.py
      - name: Commit verified demo only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android-demo/rc1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified RC1 open-film Android demo'
          git push origin HEAD:main
