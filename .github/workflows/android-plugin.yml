name: Build Harbor Android prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/android/**'
      - '.github/workflows/android-plugin.yml'
permissions:
  contents: read
jobs:
  dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM catalog tests
        run: |
          mvn -q dependency:get -Dartifact=org.json:json:20240303
          export HARBOR_JSON_JAR="$HOME/.m2/repository/org/json/json/20240303/json-20240303.jar"
          test -f "$HARBOR_JSON_JAR"
          bash engine/android/test.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify DEX
        run: bash engine/android/build.sh
      - name: Test verified LAN deployment
        run: |
          cd engine/android
          HARBOR_REQUIRE_ARTIFACT=1 python3 -m unittest test_serve_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-android-prototype
          path: |
            engine/android/build/harbor.jar
            engine/android/build/sha256.txt
          if-no-files-found: error
