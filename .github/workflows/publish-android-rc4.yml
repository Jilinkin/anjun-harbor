name: Build and publish RC4 static demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-rc4.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: static-rc4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM and Python regressions
        run: |
          mvn -q dependency:get -Dartifact=org.json:json:20240303
          export HARBOR_JSON_JAR="$HOME/.m2/repository/org/json/json/20240303/json-20240303.jar"
          test -f "$HARBOR_JSON_JAR"
          bash engine/android/test.sh
          cd engine/android
          python3 -m unittest test_integrity_release.py test_rc4_media_probe.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify DEX
        run: bash engine/android/build.sh
      - name: Bounded media header checks
        run: |
          python3 engine/android/rc4_media_probe.py > engine/android/build/media-probe.json
          cat engine/android/build/media-probe.json
      - name: Publish binary and integrity configurations atomically
        run: |
          python3 engine/android/publish_rc4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android-demo/rc4
          git commit -m 'Prepare RC4 demo binary'
          REF=$(git rev-parse HEAD)
          SHA=$(awk '{print $1}' engine/android/build/sha256.txt)
          python3 engine/android/integrity_release.py --version rc4 --ref "$REF" --expected-sha256 "$SHA"
          git add -- android-demo/rc4
          git commit -m 'Add RC4 fixed-revision integrity hints'
          git push origin HEAD:main
