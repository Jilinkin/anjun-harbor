name: Validate and publish resource index
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - catalog.json
      - legacy.json
      - scripts/build.py
      - scripts/test_build.py
      - scripts/probe.py
      - scripts/test_probe.py
      - scripts/audit_dependencies.py
      - scripts/test_audit_dependencies.py
      - scripts/compare_upstream.py
      - scripts/test_compare_upstream.py
      - .github/workflows/update.yml
permissions:
  contents: write
concurrency:
  group: resource-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s scripts -p 'test_*.py'
            python3 scripts/build.py --publish
            python3 scripts/probe.py
            git add -A -- index.json warehouses health.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish reviewed resource index'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
