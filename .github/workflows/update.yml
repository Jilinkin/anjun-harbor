name: Refresh resource index
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/check.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: resource-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check and regenerate index
        run: python3 scripts/check.py
      - name: Publish changed files
        run: |
          git add index.json status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh resource index'
          git push
