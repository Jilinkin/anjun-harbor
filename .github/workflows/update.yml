name: Validate and publish resource index
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - catalog.json
      - legacy.json
      - scripts/build.py
      - scripts/test_build.py
      - scripts/probe.py
      - scripts/test_probe.py
      - scripts/audit_dependencies.py
      - scripts/test_audit_dependencies.py
      - scripts/compare_upstream.py
      - scripts/test_compare_upstream.py
      - scripts/test_manager.py
      - scripts/test_organizer.cjs
      - scripts/release.py
      - scripts/test_release.py
      - scripts/smoke_server.py
      - scripts/test_smoke.py
      - scripts/local_library.py
      - scripts/test_local_library.py
      - scripts/aggregate.py
      - scripts/test_aggregate.py
      - scripts/personalize.py
      - scripts/test_personalize.py
      - scripts/harbor_engine.py
      - scripts/engine_server.py
      - scripts/test_engine.py
      - scripts/engine_network.py
      - scripts/test_engine_network.py
      - scripts/engine_rules.py
      - scripts/test_engine_rules.py
      - scripts/engine_html.py
      - scripts/test_engine_html.py
      - scripts/engine_registry.py
      - scripts/test_engine_registry.py
      - engine/examples/**
      - open.json
      - open/**
      - smoke.json
      - smoke/**
      - release-control.json
      - manager.html
      - .github/workflows/update.yml
permissions:
  contents: write
concurrency:
  group: resource-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s scripts -p 'test_*.py'
            python3 -c 'from pathlib import Path; s=Path("manager.html").read_text(); Path("/tmp/harbor-manager.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
            node --check /tmp/harbor-manager.js
            node scripts/test_organizer.cjs
            python3 scripts/release.py
            python3 scripts/probe.py
            git add -A -- index.json test.json releases release-status.json health.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish reviewed resource index'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
