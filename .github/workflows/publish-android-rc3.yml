name: Build and publish RC3 static demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-rc3.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: static-rc3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Jilinkin/anjun-harbor/actions/runs/45584296019 --jq 'select(.conclusion == "success" and .head_sha == "31d2aa3f131049247f6f0dcba94efcbe0496a1ec") | .id' | grep -x 45584296019
      - uses: actions/download-artifact@v4
        with:
          name: harbor-android-prototype
          run-id: 45584296019
          github-token: ${{ github.token }}
          path: engine/android/build
      - name: Verify existing binary and integrity tests
        run: |
          cd engine/android
          python3 -m unittest test_integrity_release.py
          cd build
          sha256sum -c sha256.txt
          cd ..
          python3 verify.py
      - name: Publish binary and integrity configurations atomically
        run: |
          python3 engine/android/publish_rc3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android-demo/rc3
          git commit -m 'Prepare RC3 demo binary'
          REF=$(git rev-parse HEAD)
          SHA=$(awk '{print $1}' engine/android/build/sha256.txt)
          python3 engine/android/integrity_release.py --version rc3 --ref "$REF" --expected-sha256 "$SHA"
          git add -- android-demo/rc3
          git commit -m 'Add RC3 fixed-revision integrity hints'
          git push origin HEAD:main
